[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retromodgen"
version = "0.1.0"
description = "Model-agnostic retro 3D asset generation and compilation harness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "httpx>=0.27,<1",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
mesh = [
  "numpy>=1.26",
  "trimesh>=4.4",
  "Pillow>=10.0",
]
comfy = [
  "websockets>=13,<16",
]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "mypy>=1.11",
]
all = [
  "numpy>=1.26",
  "trimesh>=4.4",
  "Pillow>=10.0",
  "websockets>=13,<16",
]

[project.scripts]
retromodgen = "retromodgen.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
markers = [
  "comfy_live: requires a running compatible ComfyUI instance",
]
